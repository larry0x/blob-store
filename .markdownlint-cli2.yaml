# markdownlint-cli2's configuration, read by `just lint-markdown`, by
# `just fmt-markdown`, and by the editor extension. YAML rather than JSON so
# it can carry its reasons.

# Every Markdown file git tracks or would track: .gitignore keeps the scratch
# folder, dependencies, and build output out.
globs:
  - "**/*.md"
gitignore: true

config:
  # Underscores for italics, asterisks for bold.
  emphasis-style:
    style: underscore
  strong-style:
    style: asterisk

  # A paragraph is one line, however long it runs.
  line-length: false

  # Padding a table's columns to align its pipes makes a wide table harder
  # to read, not easier, and the rule has no width threshold to limit it.
  table-column-style: false
