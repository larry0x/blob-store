# markdownlint-cli2's configuration, read by `just lint-markdown` and
# `just fmt-markdown`. YAML rather than JSON so it can carry its reasons.

# Every Markdown file git tracks or would track: .gitignore keeps the build
# output out.
globs:
  - "**/*.md"
gitignore: true

config:
  # Underscores for italics, asterisks for bold.
  emphasis-style:
    style: underscore
  strong-style:
    style: asterisk

  # A paragraph is one line, however long it runs.
  line-length: false
