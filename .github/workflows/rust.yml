# The jobs live in the tools repository, as a reusable workflow; this file
# holds the triggers. `just sync-tools` writes the commit below to match the
# version of the tools input that flake.lock pins, and `nix flake check` fails
# when the two differ.

name: Rust

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The workflow runs on every change, with no paths filter.
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  rust:
    uses: larry0x/tools/.github/workflows/rust.yml@efa7fa8784511b7c2c6944f19815c95e6c392e65
