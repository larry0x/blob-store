# https://taplo.tamasfe.dev/configuration/formatter-options.html

# An array's order can carry meaning, such as ruff's isort section-order, so
# the formatter leaves arrays as written. A key's order never does in TOML.

[formatting]
align_comments        = false
align_entries         = true
allowed_blank_lines   = 1
array_auto_expand     = true
column_width          = 100
inline_table_expand   = false
reorder_arrays        = false
reorder_inline_tables = true
reorder_keys          = true
